[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscan"
version = "0.1.0"
description = "Calibrated complex microwave measurement reconstruction research pipeline"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26", "scipy>=1.11", "PyYAML>=6"]

[project.optional-dependencies]
hdf5 = ["h5py>=3.10"]
test = ["pytest>=8", "h5py>=3.10"]

[project.scripts]
microscan = "microscan.cli:main"

[tool.setuptools.packages.find]
include = ["microscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
