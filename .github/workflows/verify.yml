name: Bounded implementation verification
on:
  push:
  pull_request:
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q --junitxml=verification.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-verification
          path: verification.xml
